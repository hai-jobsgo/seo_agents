extract_outline_task:
  description: >
    Generate a comprehensive content outline for the article using its content and, if available, its table of contents.  
    The outline should be hierarchical with proper markdown formatting for headings (using #, ##, ###, etc.).
    
    For each section and subsection:
    1. Include the heading with appropriate markdown formatting
    2. Add brief inline notes in [square brackets] immediately after complex or unique sections that require special handling
    3. These notes should explain:
       - How to approach technically complex concepts
       - What specific examples or case studies to include
       - Any unique formatting requirements (tables, code blocks, etc.)
       - Key statistics or data points that must be incorporated
       - Special stylistic considerations for that section
    
    IMPORTANT GUIDELINES:
    - Ignore any unwanted content from other parts of the webpage (navigation bars, sidebars, footers, comments, etc.)
    - Focus only on the main article's substantive content
    - Identify and exclude any irrelevant sections not belonging to the actual article
    - The entire outline, including ALL headings, notes, and guidance must be written in Vietnamese
    - From H2 downward (H2, H3, H4, ...), write headings in normal Vietnamese sentence case - capitalize only the
      first letter of the heading and any proper nouns. Do NOT capitalize every word (no Title Case).
    - Do not embed a specific calendar year into any heading or note unless that section is inherently time-sensitive
      (pricing, rankings, market data, current events). If a note references external research or statistics, tell
      the writer to cite the source's own name/year rather than inventing or assuming a year.

    Do not provide full content, only structured guidance. The outline should serve as a comprehensive blueprint that allows another AI to write the full article without needing to reference the original.

    Table of contents (if available):
    {toc}

    Article content:
    {content}
  expected_output: >
    A markdown-formatted outline in Vietnamese that accurately reflects the article's structure with inline writing guidance for complex sections.

    Example format:
    # Tiêu Đề Chính
    ## Tiêu đề phụ 1
    ### Tiêu đề phụ nhỏ A [Ghi chú: Giải thích khái niệm kỹ thuật này bằng cách sử dụng phép so sánh X; bao gồm công thức cho Y và trích dẫn nghiên cứu của Smith kèm tên nguồn/năm gốc của nghiên cứu đó]
    ## Tiêu đề phụ 2 [Ghi chú: Tạo bảng so sánh thể hiện sự khác biệt giữa phương pháp A, B và C; nhấn mạnh các cân nhắc đạo đức]
    
    The outline should be detailed enough that a writer can understand how to approach each section without seeing the original article.
  agent: content_analyzer


generate_outline_task:
  description: >
    Generate a SEO-optimized article outline by strategically combining and enhancing elements from the top 3 articles' content for the target keyword.

    ANALYSIS PHASE:
    For each article outline:
    * Identify high-performing sections addressing primary user search intent
    * Extract unique perspectives or angles exclusive to each article
    * Note content gaps and underdeveloped areas with expansion potential
    * Evaluate structural flow, readability, and information hierarchy
    * Highlight practical, vehicle-maintenance-focused elements with particular relevance to target audience

    SYNTHESIS PHASE:
    Create a superior, focused outline by:
    * **Prioritizing Focus over Comprehensiveness:** Select only the most relevant sections and ideas from the source articles. The goal is depth and directness in answering the user's query, not covering every possible tangent.
    * **Answering the Core Question Early:** Structure the outline to address the main keyword's intent immediately, preferably within the introduction or the first H2 section, to optimize for featured snippets.
    * **Assigning Word Counts:** For every section and subsection, include an estimated word count in the [GHI CHÚ: ...] notes, sized so the SUM lands close to the average figure below (not the ceiling). This is crucial for controlling the article's final length. LENGTH GUIDANCE: {word_count_guidance}
    * **Strategic Combination:** Incorporate the best sections from the source articles, eliminating redundancies and adding unique, high-value points that others have missed.
    * **Logical Flow:** Organize the selected information in a clear, logical progression that guides the reader smoothly through the topic.
    * When incorporating a section from any article's outline:
      - Transfer any existing [NOTES: ] from that outline directly when they provide valuable guidance
      - Adapt notes as needed to maintain our NATCenter perspective
      - Consolidate overlapping notes from multiple sources when appropriate
      - Ensure notes provide clear writing guidance for complex or unique sections
    * Maintain consistent [NOTES: ] formatting throughout the combined outline
    * Ensuring comprehensive coverage of both everyday car owner and professional garage/mechanic perspectives where relevant
    * REMOVE any prominent promotion of competing brands - only NATCenter is allowed as a promoted brand reference
    

    OPTIMIZATION GUIDELINES:
    * Include primary keyword and semantic variations in key headings
    * Flag sections ideal for internal linking opportunities
    * Suggest potential meta title and description formulations
    * Always include a FAQ section at the end of the outline with 2-4 relevant questions

    IMPORTANT:
    * The entire output outline, including ALL headings, sections, notes, and meta information must be written in Vietnamese.
    * The outline MUST use a numbering system with main sections numbered as 1, 2, 3... and subsections as 1.1, 1.2, 1.3... etc.
    * AVOID creating main sections (e.g., ## 1. Section) that contain only a single subsection (e.g., ### 1.1. Subsection). If a topic for a main section seems to only have one sub-point, consider if that sub-point can be elevated to a main section itself, or if its content can be merged into a related, broader section.
    * The FAQ section itself should NOT have a section number, and its questions should use a separate numbering (1., 2., 3., etc.)
    * The FAQ section heading must be exactly "Câu hỏi thường gặp".
    * FAQ questions should NOT address topics that are already covered in the main content.
    * From H2 downward (H2, H3, H4, ...) - including FAQ question headings - write headings in normal Vietnamese
      sentence case: capitalize only the first letter and any proper nouns. Do NOT capitalize every word (no Title Case).
    * Do not embed a specific calendar year into any heading or note unless that section is inherently time-sensitive
      (pricing, rankings, market data, current events); for such sections, note that the writer should use the
      actual current month/year at writing time rather than a fixed or guessed year.

    Keyword: {keyword}

    Article 1 outline:
    {article_1_outline}

    Article 2 outline:
    {article_2_outline}

    Article 3 outline:
    {article_3_outline}

  expected_output: >
    A SEO-optimized article outline in Vietnamese that strategically combines elements from all top articles.
    
    Example format in Vietnamese:
    # Đề Cương Bài Viết Tối Ưu SEO: [Từ Khóa Chính] [Số từ mục tiêu: theo LENGTH GUIDANCE ở trên]

    ## 1. Giới thiệu [GHI CHÚ: Mở đầu với thống kê thuyết phục về nhu cầu sử dụng phụ tùng/lốp xe ô tô; trả lời trực tiếp câu hỏi "X là gì" trong đoạn đầu tiên để nhắm đến đoạn trích nổi bật; 150-200 từ]

    ## 2. [Phần chính 1] [GHI CHÚ: Bao gồm bảng so sánh thể hiện các lựa chọn X và Y cho chủ xe; kết hợp số liệu thống kê từ (nguồn cụ thể nếu có); tổng cộng 400-500 từ]
    ### 2.1. [Tiểu mục A] [GHI CHÚ: Tạo định dạng danh sách kiểm tra có thể thực hiện được; cơ hội cho đồ họa tùy chỉnh thể hiện quy trình; 200-250 từ]
    ### 2.2. [Tiểu mục B] [GHI CHÚ: Bao gồm góc nhìn chuyên gia từ kỹ thuật viên/gara ô tô; tập trung vào giải quyết hiểu lầm phổ biến về X; 200-250 từ]

    ## 3. [Phần chính 2] [GHI CHÚ: Cấu trúc như hướng dẫn từng bước; kết hợp H2 với từ khóa khớp chính xác cho truy vấn tìm kiếm "Làm thế nào để [từ khóa]"; tổng cộng 600-700 từ]
    ### 3.1. [Tiểu mục A] [GHI CHÚ: ...; 300-350 từ]
    ### 3.2. [Tiểu mục B] [GHI CHÚ: ...; 300-350 từ]

    [Các phần bổ sung khác nếu phù hợp...]

    ## 4. Kết luận [GHI CHÚ: Tóm tắt các điểm chính; bao gồm lời kêu gọi hành động cụ thể cho chủ xe khi chọn mua hoặc bảo dưỡng; 100-150 từ]

    ## Câu hỏi thường gặp
    ### 1. [Câu hỏi 1]
    ### 2. [Câu hỏi 2]

    All headings from H2 downward (including FAQ questions) must use normal Vietnamese sentence case (capitalize
    only the first letter and proper nouns, not every word). The outline should be a strategic blueprint that combines the strongest elements from the articles' content while adding unique value and maintaining optimal structure for SEO performance. Each section should include specific guidance notes that enable a writer to create content superior to all existing articles. All sections must follow the numerical hierarchy (1, 2, 3 for main sections and 1.1, 1.2, etc. for subsections), except for the FAQ section which should use a separate numbering format (1., 2., 3.) for questions and should not have a section number itself.
  agent: content_outline_researcher

improve_seo_elements_task:
  description: >
    Optimize the article's title, meta description, and H1 heading based on the content outline 
    and analysis of the top 3 articles for the given keyword.
    
    Learn from the top articles' effective strategies while maintaining uniqueness, clarity, and SEO best practices.
    The improved elements should be engaging, keyword-rich, and aligned with search intent.
    
    **Optimization Guidelines:**
    - **Meta description length:** Keep between 140-160 characters (Google guidelines)
    - **Title length:** Keep between 50-60 characters (Google guidelines)
    - **For definition-based keywords ("X là gì")**, the meta description should start with a **concise one-sentence definition** before providing additional context.
    - **Try to include the main keyword** early in the title, meta description, and H1 when appropriate
    - **Incorporate authority signals** such as: Nhất, Báo cáo, Nghiên cứu, Chuyên gia, Số liệu, Thực tế, Khẳng định, Hướng dẫn, Bí quyết, Chi tiết, Từ A đến Z, Cách làm, 
    Cập nhật, Xu hướng, Mới nhất, Thay đổi, Cần làm ngay, Cảnh báo, Sai lầm, Tránh ngay, Vì sao, So sánh, Đánh giá, Tốt hơn, Hiệu quả hơn, 
    Bí mật, Làm thế nào, Đây là lý do, Tăng ngay, Nhanh chóng, etc. when appropriate
    - **Add number references** (e.g., "3 cách để...") in the title when relevant to show completeness.

    **Year/date usage in the title (read carefully):**
    - Today's actual date is month {current_month}, year {current_year} - this is the ONLY month/year you may ever
      use. Never invent, guess, or reuse a different year (e.g. do not write "2025" unless {current_year} is
      literally 2025).
    - Only put a month/year in the title if the keyword/outline is inherently TIME-SENSITIVE - i.e. its answer
      genuinely changes over time and staleness would mislead the reader: pricing/bảng giá, rankings/"top",
      promotions, market trends, statistics/reports, "mới nhất" type queries.
    - For general, evergreen content - definitions ("X là gì"), how-to/hướng dẫn, concepts, tips that don't change -
      do NOT add any month/year to the title at all, even though {current_month}/{current_year} are available. A
      timeless title outperforms one that looks stale next year.
    - When a year (or month + year) is warranted, use {current_year} (and {current_month} if the topic is monthly-
      granular, e.g. price lists) exactly as given - never a different, hardcoded, or estimated year.

    **Year/date usage in the meta description:**
    - Avoid stating a specific month/year in the meta description whenever possible, even for time-sensitive topics -
      keep the description itself timeless so it doesn't need to be rewritten every month/year. If freshness must be
      signaled, prefer wording like "mới nhất", "cập nhật" over a literal date.

    Keyword: {keyword}

    Content outline:
    {content_outline}

    Our current title: {current_title}
    Our current meta description: {current_meta_description}
    Our current H1: {current_h1}
    
    Article 1:
    - Title: {article_1_title}
    - Meta Description: {article_1_meta_description}
    - H1: {article_1_h1}
    
    Article 2:
    - Title: {article_2_title}
    - Meta Description: {article_2_meta_description}
    - H1: {article_2_h1}
    
    Article 3:
    - Title: {article_3_title}
    - Meta Description: {article_3_meta_description}
    - H1: {article_3_h1}

  expected_output: >
    An optimized title, meta description, and H1 heading in the following format:
    
    **Title:** [Optimized Title] (50-60 characters)
    
    **Meta Description:** [Optimized Meta Description] (140-160 characters)
    
    **H1:** [Optimized H1]
    
    The optimized elements should incorporate key takeaways from the top articles while being original, engaging,
    and aligned with the content outline. Ensure the main keyword is used effectively, and include authority words
    and numbers when appropriate to enhance credibility and relevance. Only include a month/year in the title when
    the topic is genuinely time-sensitive, and if so use the real current month/year provided - never a fabricated
    or outdated one. Avoid stating a specific month/year in the meta description.

  agent: seo_content_optimizer


write_article_task:
  description: >
    Create a comprehensive, SEO-optimized article based on the provided content outline and any extra user requests (see `extra_request`).
    Pay close attention to the inline notes in [brackets] within the outline, as they contain specific guidance
    for writing complex or unique sections.

    TARGET LENGTH (HARD LIMIT): {word_count_guidance}
    This is a hard limit, not a floor. After drafting, COUNT the words in your draft; if it exceeds the limit, cut
    redundant sentences, merge overlapping points, and tighten wording until it fits - do not submit an article
    that overshoots this limit.

    WORD COUNT ADHERENCE:
    * The outline provides an estimated word count for each section and subsection in the `[GHI CHÚ: ...]` notes.
    * It is critical that you follow these word count guidelines for each section as closely as possible.
    * This will ensure the total article length stays within the TARGET LENGTH above - do not pad sections to exceed it.
    
    EXTRA REQUESTS:
    * The `extra_request` input may contain additional user requirements or requests for the article (e.g., style, structure, specific content, or exclusions).
    * Only fulfill these extra requests if doing so does NOT compromise the overall quality, coherence, or SEO value of the article.
    * If an extra request would reduce the quality or effectiveness of the article, ignore it or address it only partially.
    
    CONTENT DEVELOPMENT APPROACH:
    * If an original article is provided:
      - Use it as a reference, selectively incorporating high-quality, relevant content
      - Significantly improve upon weak sections identified in the outline
      - Update any outdated information with current data and insights
    * If no original article is provided:
      - Develop the article entirely from the outline, following all section guidance
    
    WRITING STYLE REQUIREMENTS:
    * Keep paragraphs SHORT: 2-4 sentences (roughly 2-4 lines) per paragraph. Break longer explanations into
      multiple short paragraphs rather than one long block - this is a hard readability requirement, not a suggestion.
    * Within each short paragraph, still use a clear topic sentence and connect ideas with natural transition words.
    * Use formatting elements flexibly and purposefully, mixing them with short paragraphs rather than defaulting to
      wall-of-text prose:
      - Use **bold** to highlight key terms, numbers, or the main takeaway of a paragraph
      - Use *italics* for emphasis, definitions, or secondary notes
      - Use bullet lists for enumerations, feature lists, pros/cons, or step-by-step instructions - do NOT force
        these into a single run-on paragraph
      - Convert comparisons among several items/aspects into a well-structured table whenever appropriate
    * Bullet items themselves should stay short (a phrase or one sentence each); if a "bullet" point actually needs
      several sentences of explanation, that's a sign it should be its own short paragraph instead
    * Write in an engaging, authoritative tone appropriate for car owners and drivers
    * Address reader pain points and provide actionable solutions
    * Incorporate real-world examples, case studies, and statistics as specified in the outline notes
    * Elaborate on key concepts within the word-count budget for that section - depth means precision and useful
      detail, not extra length; do not pad content just to sound more thorough

    CREDIBILITY / SOURCING:
    * Any statistic, data point, survey result, or direct quote MUST be attributed to a real, verifiable, credible
      source named inline in the text (e.g., organization, publication, or study name, plus the source's own
      publication year if relevant) - e.g. "theo báo cáo của Hiệp hội Các nhà sản xuất ô tô Việt Nam (VAMA, 2024)".
    * NEVER fabricate a statistic, source, study, or quote. If the outline notes suggest a data point but no
      verifiable source is available to you, either omit the specific number or phrase it qualitatively instead of
      inventing a fake citation.
    * A cited source's own year (e.g. the year a report was published) is independent from - and not restricted by -
      the "when to use the current year" rule below; cite the source's real year as-is.

    YEAR/DATE USAGE IN BODY CONTENT:
    * Today's actual date is month {current_month}, year {current_year} - the only current month/year you may ever
      use in the article. Never invent or reuse a different year (e.g. do not write "2025" unless {current_year} is
      literally 2025).
    * Only mention the current month/year when the specific sentence is inherently time-sensitive (prices, current
      promotions, rankings, market data, "hiện nay"/"hiện tại" type statements). Do not sprinkle the year into
      general definitions, explanations, or how-to content that doesn't need it.

    STRUCTURAL CONSIDERATIONS:
    * Follow the exact hierarchy of the provided outline (H1, H2, H3, etc.)
    * From H2 downward (H2, H3, H4, ...), write headings in normal Vietnamese sentence case - capitalize only the
      first letter of the heading and any proper nouns. Do NOT capitalize every word (no Title Case). This applies
      even if the outline itself has Title Case headings - normalize them when writing.
    * Implement any formatting instructions specified in the outline notes (tables, FAQs, etc.)
    * Treat the word count target for each section (from the outline notes) and the overall TARGET LENGTH above as
      hard limits, not minimums - do not exceed them
    * Create smooth transitions between major sections
    * For each H2 section, write a brief introduction (1-2 sentences) to set the context before diving into the H3 subsections whenever appropriate.
    * Keep introduction and conclusion sections brief and direct - no lengthy opening or closing.
    * For introduction section (opening statement):
      - Limit to 3-4 concise, impactful sentences
      - Naturally incorporate the main keyword.
      - Do not include any links.
    * For conclusion sections:
      - Limit to 3-4 concise, impactful sentences
      - Naturally incorporate the main keyword
      - Choose the most contextually appropriate link based on the article topic
    * Position the FAQ section at the end of the article, after the Conclusion. There should be no more content after the FAQ section.
    * The FAQ section heading must be exactly "Câu hỏi thường gặp".
    * FAQ answers should be concise, limited to 1-2 lines per question
    * FAQ questions should:
      - Be formatted in normal Vietnamese sentence case (capitalize only the first letter and proper nouns). Do NOT
        capitalize every word and do NOT capitalize the entire question.
      - Address topics NOT already covered in the main sections or subsections
      - Focus on related questions users might have that extend beyond the core content
      - Provide additional value rather than repeating information already presented
      - Target additional search queries related to the main keyword
    
    SEO OPTIMIZATION:
    * Incorporate the target keyword naturally in:
      - First 50 words of the introduction
      - At least one H2 heading (preferably in the form of a question)
    * If the target keyword is in the format "X là gì", you can also use "X" as a keyword variation for more natural placement.
    * Include semantic variations and related terms throughout the content
    * Optimize for featured snippet potential by directly answering key questions
    * Use descriptive alt text if suggesting images
    
    IMPORTANT RESTRICTIONS:
    * DO NOT prominently promote any direct competitor brands (e.g. other tire/auto-parts retailers or manufacturers referenced in source material)
    * Only NATCenter is allowed as a promoted brand reference in the content
    * When discussing industry examples or comparisons, use generic terms like "một số đơn vị cung cấp phụ tùng khác" or "các cửa hàng lốp xe khác"
    
    IMPORTANT: The entire article must be written in Vietnamese in Markdown format, maintaining consistency with the outline.
    
    Content Outline:  
    {content_outline}  

    Target Keyword: {keyword}
    Suggested Title: {optimized_title}
    Suggested Meta Description: {optimized_description}
    Suggested H1: {optimized_h1}
    Extra Request (optional): {extra_request}
    Current Month/Year (for time-sensitive mentions only): {current_month}/{current_year}

    Original Article (optional):
    {original_article}

  expected_output: >
    A publication-ready article in Vietnamese in Markdown format that fully implements the provided outline structure, guidance notes, and any extra requests (if they do not reduce article quality).
    The content should demonstrate expertise on the topic while providing practical value to car owners
    and drivers. The article should be comprehensive, engaging, and naturally optimized for search engines.

    The final article should include:
    - The specified optimized H1 heading
    - All section and subsection headings exactly as structured in the outline with the same numbering, and written
      in normal sentence case from H2 downward (not Title Case)
    - Short paragraphs (2-4 sentences each) throughout, with bullet lists/tables/bold/italics used flexibly where
      they aid scannability
    - Fully developed content for each section following the inline guidance notes
    - Any statistic or quote attributed to a named, credible source
    - No fabricated or stale years - the current year only appears where the content is genuinely time-sensitive
    - Brief, direct introduction and conclusion sections (no lengthy opening or closing)
    - Concise FAQ answers (1-2 lines per question, less than 43 words).
    - FAQ questions addressing topics not already covered in the main content
    - Appropriate formatting elements as indicated in the outline
    - Natural incorporation of the target keyword and semantic variations
    - NO prominent promotion of competitor brands

    The final article must NOT include table of content.
    
    The article should require minimal editing before publication and reflect best practices in both 
    content development and SEO optimization.
  
  agent: seo_content_writer
  
rewrite_article_task:
  description: >
    Improve the provided article by addressing specific feedback points while adhering to SEO best practices.
    The primary goal is to surgically implement improvements based on the feedback, leaving the rest of the article untouched.
    If any feedback is unclear, contradictory, or detrimental to SEO, use your expert judgment to ignore it or adapt it appropriately.

    INSTRUCTIONS:
    * Meticulously review each point in the provided feedback.
    * Modify the article ONLY to address the specific issues raised in the feedback.
    * Preserve the original content, tone, and structure of the article as much as possible.
    * For every change you make, ensure it aligns with modern SEO best practices (e.g., keyword usage, readability, E-E-A-T).
    * CRITICAL: If a piece of feedback is unclear, makes no sense, or would harm the article's quality or SEO, you have the authority to ignore it.
    * The entire rewritten article must be in Vietnamese.

    Original Article:
    {original_article}
    
    Feedback:
    {feedback}
    
    Target Keyword: {keyword}

  expected_output: >
    A precisely updated article in Vietnamese (markdown format) that only incorporates the valid and clear feedback provided.
    The article should remain largely the same as the original, with only targeted improvements.
    
    The improved article must:
    - Only contain changes that directly correspond to actionable feedback points.
    - Leave all other sections and sentences of the original article unchanged.
    - Follow SEO best practices for all modifications.
    - Be ready for publication with correct markdown formatting.
  agent: seo_content_rewriter

trim_article_task:
  description: >
    The article below is longer than its target length. Condense it so the total word count comes down to
    approximately {target_word_count} words or fewer, while preserving all headings/subheadings (with their exact
    numbering), the FAQ section, tables, and all key factual information.

    HOW TO CONDENSE:
    * Remove redundant sentences that repeat a point already made elsewhere in the same section
    * Merge overlapping ideas into a single, tighter sentence
    * Cut filler phrases, throat-clearing, and overly long transitions
    * Shorten verbose explanations to their essential point, without losing accuracy
    * Do NOT remove entire sections, headings, the FAQ section, or tables - condense their prose, don't delete structure
    * Keep the article's core facts, examples, and statistics intact

    IMPORTANT: The output must remain entirely in Vietnamese, in Markdown format, with the same heading structure
    and numbering as the original article.

    Target Keyword: {keyword}
    Target word count: {target_word_count} words or fewer

    Original Article:
    {original_article}

  expected_output: >
    A condensed version of the article in Vietnamese Markdown, at or under the target word count, with the same
    heading structure/numbering, FAQ section, and tables preserved, and no loss of key factual content.
  agent: seo_content_rewriter


generate_image_prompts_task:
  description: >
    Generate 3 high-quality image prompts based on the keyword. These prompts will be used 
    to create visual elements that enhance understanding, break up text, and improve user engagement.

    IMAGE PLANNING GUIDELINES:
    * Create 3 distinct image concepts that reflect different aspects of the keyword:
      - One realistic stock photo representing the main idea
      - One professional photography showing practical application or implementation
      - One real-world scenario showing context or relationships
    
    * For each image:
      1. Create a detailed image generation prompt (150-250 words) that describes:
         - The exact visual elements to include (realistic style, not illustration or sketches or diagrams)
         - The style and mood of the image (maintain consistency across all three)
         - Color preferences (use a consistent palette across all images)
         - Avoid any text elements or graphs in the images
         - Any cultural or regional elements specific to Vietnamese audience
      2. Write a brief, descriptive alt text in Vietnamese (10-15 words)
      3. Suggest an appropriate image caption in Vietnamese (1 sentence)
      4. Generate a file name based on the keyword with increasing index (e.g., keyword_1.jpg, keyword_2.jpg, keyword_3.jpg)
      5. Specify the exact section name from the article where this image would be most effective
    
    * Image placement guidelines:
      - Place the first image in either the first or second section of the article
      - Distribute the remaining two images in different sections throughout the article
      - Space images evenly to maintain reader engagement throughout
      - The chosen section should already contain at least one paragraph of body text so the image can be inserted
        after that paragraph - never choose a section whose heading is immediately followed by another heading or
        by a bullet list with no lead-in paragraph, since the image must not land directly under a heading
    
    * Ensure the image concepts:
      - Use realistic photography (no illustration or sketches or diagrams)
      - Maintain professional, high-quality visual standards
      - Would be clear and understandable when viewed on mobile devices
      - Are appropriate for a car-owner / automotive context
    
    * Image design considerations:
      - Use natural, realistic lighting and environments
      - Focus on clear, high-resolution visual elements
      - Balance simplicity with informational value
      - Design with both light and dark mode compatibility in mind
      - Use purely visual elements without text overlays or graphs
    
    IMPORTANT: All image captions and alt text must be in Vietnamese to maintain language consistency.
    
