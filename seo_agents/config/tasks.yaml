review_article_task:
  description: >
    Provide a focused SEO review of the article by analyzing it SECTION BY SECTION, identifying only the most impactful quick-win opportunities 
    for enhancement. The article should already be well-optimized, so concentrate on final polishing touches 
    rather than major restructuring.
    
    PROCESS FOR REVIEW:
    1. First identify all major sections and subsections in the article
    2. Review each section carefully, but only provide feedback for sections that can be improved. Skip sections that are already good.
    3. For each section needing improvement, provide specific recommendations using the "Section Improvement Checklist" below.
    4. For each suggestion, specify exactly which section, paragraph and sentence it applies to
    
    SECTION IMPROVEMENT CHECKLIST:
    1. KEYWORD OPTIMIZATION
        * Within each section, check for opportunities to better integrate primary or semantic keywords
        * Suggest simple keyword placement adjustments without changing the section structure
    
    2. FEATURED SNIPPET OPPORTUNITIES
        * Identify if the section could be better formatted to target featured snippets
        * DO NOT suggest reformatting FAQ sections as tables
    
    3. CONTENT ENHANCEMENT FOR THE SECTION
        * If a section lacks data points, suggest 1-2 specific statistics or examples to strengthen it if appropriate, and only
        if you can suggest specific data with valid sources, not vague examples.
        * If a "bullet point" actually contains several sentences of explanation, suggest turning it into its own
          short paragraph (2-4 sentences); genuine lists (steps, enumerations, comparisons) should stay as bullets.
        * Flag any year reference that is hardcoded/stale or that appears in content which isn't actually
          time-sensitive (e.g. a year embedded in a general definition or how-to); recommend removing it unless the
          section is genuinely time-sensitive (pricing, rankings, market data), in which case it should reflect the
          real current month/year at the time of review - never a guessed or fixed year.

    4. SECTION READABILITY
        * Suggest specific bolding or formatting opportunities within the section
        * Ensure paragraphs stay short (2-4 sentences); recommend splitting long paragraphs and, separately, using
          bullet lists/tables for genuine enumerations, steps, or comparisons rather than forcing everything into prose
        * If the section contains comparisons, suggest converting them to a well-structured table (except for FAQ sections)
        * Flag any H2/H3/H4 heading that is capitalized word-by-word (Title Case) and suggest normal sentence case instead

    5. SECTION CREDIBILITY
        * Flag exaggerated claims within the section that lack substantiated evidence
        * Flag any hallucinations (made-up references, fake people, statistics) within the section.
        * Suggest rephrasing or adding supporting data to strengthen credibility
        * Flag any statistic or quote that isn't attributed to a named, credible source, and suggest adding one
    
    6. NATURAL LANGUAGE IN THE SECTION
        * Identify specific formal/robotic phrases within the section and suggest more conversational alternatives
        * Recommend adding natural connecting phrases between paragraphs or ideas within the section
        * Identify repeated phrases within the section and suggest alternatives.
    
    7. SECTION QUALITY CHECKS (Required)
        * For FAQ section, check if questions repeat information already covered elsewhere
        
    
    FEEDBACK GUIDELINES:
    * Focus ONLY on sections needing improvement - skip sections that are already good enough
    * Be extremely selective - focus only on changes with high SEO impact and low implementation effort
    * Provide specific, actionable suggestions with exact locations (section, paragraph, sentence)
    * Keep feedback concise and implementation-focused
    * Assume most sections are already well-structured and only need minor optimizations
    * For bullet points that are really multi-sentence explanations, suggest converting them to short paragraphs;
      keep genuine lists as bullets
    * Flag stale, fabricated, or unnecessary year references (see CONTENT ENHANCEMENT above)
    * Look for opportunities to make the writing sound more natural and conversational
    
    IMPORTANT: Write all feedback in Vietnamese to ensure consistency for the content creator.

    Keyword: {keyword}
    
    Article Content:
    {article_content}

  expected_output: >
    A focused review in Vietnamese that provides actionable improvements for only the sections needing enhancement.
    
    Example format (in Vietnamese):
    ## Đề xuất cải thiện

    ### [Tên phần 1 cần cải thiện]
    * Gợi ý cải thiện 1 & tham chiếu đến nội dung gốc (đoạn, câu) nếu phù hợp.
    * Gợi ý cải thiện 2 & tham chiếu đến nội dung gốc (đoạn, câu) nếu phù hợp.
    * Gợi ý cải thiện 3 & tham chiếu đến nội dung gốc (đoạn, câu) nếu phù hợp.
    
    ### [Tên phần 2 cần cải thiện]
    * Gợi ý cải thiện 1 & tham chiếu đến nội dung gốc (đoạn, câu) nếu phù hợp.
    * Gợi ý cải thiện 2 & tham chiếu đến nội dung gốc (đoạn, câu) nếu phù hợp.

    
    ### [Phần FAQ - nếu cần]
    * Câu hỏi trùng lặp: [Liệt kê các câu hỏi FAQ trùng lặp với nội dung chính và đề xuất cách xử lý]
    * Đề xuất cải thiện: [Cách làm cho FAQ phù hợp hơn với nội dung của bài]

    Đối với mỗi gợi ý, hãy cung cấp vị trí chính xác (đoạn, câu) và đề xuất cụ thể để cải thiện. Tất cả phản hồi phải ngắn gọn, cụ thể và tập trung vào các cải tiến có tác động SEO cao.
  agent: seo_content_reviewer
  
rewrite_article_task:
  description: >
    Update and improve the article based on SEO feedback while maintaining the core message and expertise. 
    The goal is to create an enhanced version that better aligns with search intent, improves ranking potential, 
    and provides more value to the target audience of car owners and drivers.
    
    UPDATING GUIDELINES:
    
    1. CONTENT IMPROVEMENTS
      * Address all identified content gaps from the feedback
      * Enhance sections flagged as needing more depth or detail
      * Maintain the article's core expertise and value proposition
      * Ensure comprehensive coverage of the topic that satisfies search intent
    
    2. STRUCTURE ENHANCEMENTS
      * Implement suggested improvements to headings and content organization
      * Prioritize key information according to user importance
      * Improve the logical flow between sections
      * Enhance scannability with appropriate formatting elements
    
    3. SEO OPTIMIZATION
      * Incorporate keyword optimization suggestions
      * Add or modify content to target featured snippet opportunities
      * Implement recommended semantic keywords naturally throughout
      * Optimize introduction for engagement and keyword placement
      * Improve headings for both SEO and user engagement
    
    
    4. USER EXPERIENCE FOCUS
      * Make content more engaging and valuable to target audiences
      * Ensure car owners and drivers find relevant, practical information
      * Enhance readability through improved paragraph structure
      * Maintain a authoritative yet accessible tone throughout
    
    IMPLEMENTATION APPROACH:
      * DO NOT rewrite any sentences from the original article unless specifically mentioned in the feedback
      * Keep the original numbering system for headings and subheadings
      * Only modify content explicitly flagged in the SEO feedback
      * Add new content only where gaps are identified
      * Preserve the original wording, expertise and key points wherever possible
      * Ensure all formatting follows proper markdown syntax
      * The output must be in complete markdown format ready for publishing
    
    IMPORTANT: The entire rewritten article must be in Vietnamese, maintaining consistency with the original content and maintaining the numbering system for headings and subheadings.

    Original Article:
    {original_article}
    
    SEO Review Feedback:
    {seo_feedback}
    
    Target Keyword: {keyword}


  expected_output: >
    A comprehensive, publication-ready article in Vietnamese in proper markdown format that implements only the SEO feedback 
    while preserving the original content wherever possible.
    
    
    The rewritten article should:
    - Preserve all original sentences unless specifically mentioned in the feedback
    - Only modify content explicitly flagged for improvement in the feedback
    - Add new content only where gaps are identified
    - Maintain the original article's purpose, wording, and expertise
    - Incorporate all high-priority SEO improvements mentioned in the feedback
    - Use proper markdown formatting for headings, lists, emphasis, etc.
    - Be ready for direct publication without further formatting or editing
    
    The final article should address all feedback points while minimizing changes to the original content.
  agent: seo_content_rewriter

trim_article_task:
  description: >
    The article below is longer than its target length. Condense it so the total word count comes down to
    approximately {target_word_count} words or fewer, while preserving all headings/subheadings (with their exact
    numbering), the FAQ section, tables, and all key factual information.

    HOW TO CONDENSE:
    * Remove redundant sentences that repeat a point already made elsewhere in the same section
    * Merge overlapping ideas into a single, tighter sentence
    * Cut filler phrases, throat-clearing, and overly long transitions
    * Shorten verbose explanations to their essential point, without losing accuracy
    * Do NOT remove entire sections, headings, the FAQ section, or tables - condense their prose, don't delete structure
    * Do NOT remove the internal link to https://natcenter.vn in the conclusion
    * Keep the article's core facts, examples, and statistics intact
    * Keep paragraphs short (2-4 sentences each) after condensing - if merging sentences would produce a longer
      paragraph, split the result back into multiple short paragraphs instead of leaving one long block

    IMPORTANT: The output must remain entirely in Vietnamese, in Markdown format, with the same heading structure
    and numbering as the original article.

    Target Keyword: {keyword}
    Target word count: {target_word_count} words or fewer

    Original Article:
    {original_article}

  expected_output: >
    A condensed version of the article in Vietnamese Markdown, at or under the target word count, with the same
    heading structure/numbering, FAQ section, and tables preserved, and no loss of key factual content.
  agent: seo_content_rewriter

generate_image_prompts_task:
  description: >
    Generate 3 high-quality image prompts based on the keyword. These prompts will be used 
    to create visual elements that enhance understanding, break up text, and improve user engagement.

    IMAGE PLANNING GUIDELINES:
    * Create 3 distinct image concepts that reflect different aspects of the keyword:
      - One realistic stock photo representing the main idea
      - One professional photography showing practical application or implementation
      - One real-world scenario showing context or relationships
    
    * For each image:
      1. Create a detailed image generation prompt (150-250 words) that describes:
         - The exact visual elements to include (realistic style, not illustration or sketches or diagrams)
         - The style and mood of the image (maintain consistency across all three)
         - Color preferences (use a consistent palette across all images)
         - Avoid any text elements or graphs in the images
         - Any cultural or regional elements specific to Vietnamese audience
      2. Write a brief, descriptive alt text in Vietnamese (10-15 words)
      3. Suggest an appropriate image caption in Vietnamese (1 sentence)
      4. Generate a file name based on the keyword with increasing index (e.g., keyword_1.jpg, keyword_2.jpg, keyword_3.jpg)
      5. Specify the exact section name from the article where this image would be most effective
    
    * Image placement guidelines:
      - Place the first image in either the first or second section of the article
      - Distribute the remaining two images in different sections throughout the article
      - Space images evenly to maintain reader engagement throughout
      - The chosen section should already contain at least one paragraph of body text so the image can be inserted
        after that paragraph - never choose a section whose heading is immediately followed by another heading or
        by a bullet list with no lead-in paragraph, since the image must not land directly under a heading
    
    * Ensure the image concepts:
      - Use realistic photography (no illustration or sketches or diagrams)
      - Maintain professional, high-quality visual standards
      - Would be clear and understandable when viewed on mobile devices
      - Are appropriate for a car-owner / automotive context
    
    * Image design considerations:
      - Use natural, realistic lighting and environments
      - Focus on clear, high-resolution visual elements
      - Balance simplicity with informational value
      - Design with both light and dark mode compatibility in mind
      - Use purely visual elements without text overlays or graphs
    
    IMPORTANT: All image captions and alt text must be in Vietnamese to maintain language consistency.
    
    Target Keyword: {keyword}
    Article: {article}
  expected_output: >
    Three detailed image prompt descriptions that can be used for image generation, formatted as:

    ## Image 1

    **Section Placement:** [Exact section name from article - first or second section]

    **Image Generation Prompt:** [Detailed 150-250 word description for photorealistic stock photo]

    **Alt Text (Vietnamese):** [10-15 word description in Vietnamese]

    **Caption (Vietnamese):** [1 sentence caption in Vietnamese]

    **File Name:** {keyword}_1.jpg

    ---

    ## Image 2

    **Section Placement:** [Exact section name from article - different from Image 1]

    **Image Generation Prompt:** [Detailed 150-250 word description for professional photography]

    **Alt Text (Vietnamese):** [10-15 word description in Vietnamese]

    **Caption (Vietnamese):** [1 sentence caption in Vietnamese]

    **File Name:** {keyword}_2.jpg

    ---

    ## Image 3

    **Section Placement:** [Exact section name from article - different from Images 1 and 2]

    **Image Generation Prompt:** [Detailed 150-250 word description for real-world scenario photo]

    **Alt Text (Vietnamese):** [10-15 word description in Vietnamese]

    **Caption (Vietnamese):** [1 sentence caption in Vietnamese]

    **File Name:** {keyword}_3.jpg
  agent: content_visualizer


insert_internal_link_task:
  description: >
    Insert a contextually relevant internal link into the provided content segment using the specified keyword and target URL.
    
    ANALYSIS PHASE:
    * Carefully read and understand the content segment
    * Identify the most relevant part of the segment where the keyword and link would fit naturally
    * Determine if the keyword already exists in the content or needs to be added
    * Assess if the link can be inserted by modifying an existing sentence or if a new sentence is needed
    
    IMPLEMENTATION GUIDELINES:
    * PRIORITY 1: Modify an existing sentence to incorporate the keyword and link if possible
      - Look for sentences that already mention the keyword or closely related concepts
      - Make minimal changes to maintain the original tone and flow
      - Ensure the modification sounds natural and adds value
    
    * PRIORITY 2: Add a new sentence that incorporates the keyword and link
      - The new sentence should flow naturally from the surrounding content
      - Position it where it makes the most logical sense (usually after a related point)
      - Ensure it adds value by expanding on or supporting an existing point
      - Keep the addition concise (1-2 sentences maximum)
    
    * PRIORITY 3 (LAST RESORT): Add a "Xem thêm" (Read more) reference at the end of the segment
      - Only use this approach if the other methods would be forced or unnatural
      - Format as: "Xem thêm: [keyword](target_url)"
      - Only use this as a last resort when inline insertion is not feasible
    
    HTML FORMATTING REQUIREMENTS:
    * Format the link using HTML anchor tags: <a href="target_url">keyword</a>
    * Do not use markdown formatting
    * Ensure proper HTML syntax with quotes around the href attribute
    
    IMPORTANT CONSIDERATIONS:
    * Maintain the original Vietnamese language style and tone
    * Ensure the link placement feels natural and helpful, not forced
    * The link should provide genuine value to readers interested in the topic
    * Avoid disrupting the flow of information or creating awkward phrasing
    * Do not change the meaning or intent of the original content
    
    Content Segment: {segment}
    Keyword to Link: {keyword}
    Target URL: {target_url}

  expected_output: >
    Return a structured output with two fields:
    
    1. approach: The approach used (one of: "Modified existing sentence", "Added new sentence", or "Added Xem thêm reference")
    2. modified_content: The complete segment with the internal link naturally incorporated. The link must be formatted using HTML anchor tags (<a href="target_url">keyword</a>).
    
    Example structured output:
    ```json
    {
      "approach": "Modified existing sentence",
      "modified_content": "<p>This is the modified content with <a href='https://example.com'>keyword</a> inserted naturally.</p>"
    }
    ```
    
    The output must be properly structured as a valid JSON object with these two fields.

  agent: link_inserter