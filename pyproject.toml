[project]
name = "seo-agents-standalone"
version = "0.1.0"
description = "Standalone SEO content service (write + publish articles) for a single website"
requires-python = ">=3.10,<3.12"
dependencies = [
    # Scheduling
    "apscheduler>=3.11.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    # CrewAI multi-agent pipeline
    "crewai[tools]>=0.102.0",
    "langchain-community>=0.3.0",
    "pydantic>=2.0",
    # Google Sheets / Docs / Drive
    "gspread>=6.1.4",
    "google-api-python-client>=2.190.0",
    "google-auth>=2.0",
    # Image generation (Gemini / Vertex)
    "google-genai>=1.2.0,<2.9.0",
    "pillow>=10.0",
    # Web scraping / parsing for source URLs
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "selenium>=4.28.1",
    "webdriver-manager>=4.0.2",
    # WordPress publish helpers
    "unidecode>=1.3.8",
    "numpy>=1.26,<2.0",
]

[dependency-groups]
dev = [
    "fabric>=3.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seo_agents"]
